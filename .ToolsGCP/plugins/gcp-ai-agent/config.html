  /* =====================================================================
     渲染：更多模块
     ===================================================================== */

  function enabledCount() {
    var count = 0;
    for (var i = 0; i < state.tools.length; i += 1) {
      if (state.tools[i] && state.tools[i].enabled !== false) count += 1;
    }
    return count;
  }

  function renderModulesCount() {
    var count = $('modules-count');
    if (!count) return;
    if (!state.available) {
      count.textContent = t('switch_unavailable');
      count.className = 'hint is-warn grow';
      return;
    }
    count.textContent = t('modules_enabled_count', { on: enabledCount(), total: state.tools.length });
    count.className = 'hint grow';
  }

  function emptyHint(text, warn) {
    var el = document.createElement('p');
    el.className = 'empty' + (warn ? ' is-warn' : '');
    el.textContent = String(text || '');
    return el;
  }

  /* =====================================================================
     分组：31 个模块按职责归类
     =====================================================================
     为什么按名字归组而不是让后端给组：agent_state 的 tools 里只有 name/source，
     组是**纯展示概念**，后端不该为界面排版负责；而且以后新增工具时，只要把名字
     加进下面的映射就自动归位，没加进映射的落到「其它」组里（不会消失）。
     顺序即展示顺序：越靠前越常用。 */
  var MODULE_GROUPS = [
    { key: 'library', i18n: 'group_library', names: [
      'search_resources', 'get_resource', 'open_resource', 'resource_stats',
      'list_all_resources'] },
    { key: 'favorites', i18n: 'group_favorites', names: [
      'list_favorites', 'set_favorite', 'create_favorite_folder', 'move_favorite'] },
    { key: 'ui', i18n: 'group_ui', names: [
      'goto_page', 'notify_user', 'open_page_detail', 'search_view', 'set_window_state',
      'deploy_list'] },
    { key: 'settings', i18n: 'group_settings', names: [
      'get_setting', 'set_setting', 'list_settings', 'update_settings', 'ui_switch',
      'set_theme', 'set_language', 'set_autostart', 'set_hotkeys'] },
    { key: 'plugins', i18n: 'group_plugins', names: [
      'list_plugins', 'set_plugin_enabled', 'open_plugin_config', 'manage_plugins'] },
    { key: 'files', i18n: 'group_files', names: [
      'list_dir', 'read_file', 'write_file', 'run_python', 'open_url',
      'download_resource'] },
    { key: 'system', i18n: 'group_system', names: [
      'read_logs', 'export_logs', 'app_diagnostics', 'new_chat'] },
    { key: 'other', i18n: 'group_other', names: ['self_check'] }
  ];

  /* 名字 → 组 key 的反查表（每次渲染重建很便宜，但别放在热路径里逐条 indexOf） */
  function groupOf(name) {
    for (var i = 0; i < MODULE_GROUPS.length; i += 1) {
      var group = MODULE_GROUPS[i];
      if (group.names.indexOf(name) >= 0) return group.key;
    }
    return 'other';
  }

  /* 折叠状态：localStorage 里存 "组key:0|1" 的串。默认全展开（用户点进来就是想看全貌）。 */
  var COLLAPSE_KEY = 'tgc-agent-groups';
  var SEARCH_KEY = 'tgc-agent-search';
  function readCollapsed() {
    var out = {};
    try {
      var raw = window.localStorage.getItem(COLLAPSE_KEY) || '';
      if (!raw) return out;
      raw.split(',').forEach(function (pair) {
        if (!pair) return;
        var parts = pair.split(':');
        if (parts.length === 2) out[parts[0]] = parts[1] === '1';
      });
    } catch (e) { /* 隐私模式 / 无 localStorage：当作全展开 */ }
    return out;
  }
  function writeCollapsed(map) {
    try {
      var parts = [];
      Object.keys(map).forEach(function (key) { parts.push(key + ':' + (map[key] ? '1' : '0')); });
      window.localStorage.setItem(COLLAPSE_KEY, parts.join(','));
    } catch (e) { /* 存不了就算了，不影响功能 */ }
  }

  function matchSearch(tool, needle) {
    if (!needle) return true;
    var haystack = (String(tool.name || '') + ' ' + pickText(tool.description) + ' '
      + String(tool.parameters || '')).toLowerCase();
    return haystack.indexOf(needle) >= 0;
  }

  /* 当前（过滤后）每个组里的模块；搜索时**强制展开**命中的组，否则搜了像没搜到 */
  function visibleGroups() {
    var needle = String(state.modQuery || '').trim().toLowerCase();
    var collapsed = readCollapsed();
    var buckets = {};
    for (var i = 0; i < state.tools.length; i += 1) {
      var tool = state.tools[i];
      if (!matchSearch(tool, needle)) continue;
      var key = groupOf(String(tool.name || ''));
      (buckets[key] = buckets[key] || []).push(tool);
    }
    var out = [];
    for (var j = 0; j < MODULE_GROUPS.length; j += 1) {
      var meta = MODULE_GROUPS[j];
      var list = buckets[meta.key];
      if (!list || !list.length) continue;
      out.push({
        key: meta.key, i18n: meta.i18n, tools: list,
        /* 搜索时一律展开：用户正在找东西，别让他还得再点一下。
           collapsed[key] === true 表示「用户折叠了这一组」→ open 取反。 */
        open: needle ? true : (collapsed[meta.key] !== true)
      });
      delete buckets[meta.key];
    }
    /* 映射表里没登记的新工具：落到「其它」组，绝不隐藏（否者新模块会"人间蒸发"） */
    var leftovers = [];
    Object.keys(buckets).forEach(function (key) {
      if (key === 'other') return;
      leftovers = leftovers.concat(buckets[key]);
    });
    if (leftovers.length) {
      out.push({ key: 'other', i18n: 'group_other', tools: leftovers,
                 open: needle ? true : (collapsed.other !== true) });
    }
    return out;
  }

  /* 结构签名：名字/参数/来源/危险标记 + 语言 + 搜索词。只要没变就只同步开关，不重建 DOM */
  function moduleSignature() {
    if (!state.available) return 'unavailable|' + state.code;
    var parts = ['ok|' + state.code + '|' + String(state.modQuery || '').toLowerCase()];
    for (var i = 0; i < state.tools.length; i += 1) {
      var tool = state.tools[i];
      parts.push([tool.name, tool.parameters, tool.source, tool.danger ? 1 : 0].join('~'));
    }
    return parts.join('|');
  }

  function renderModuleList(animateKey) {
    var list = $('modules-list');
    if (!list) return;
    var sig = moduleSignature();
    if (list.getAttribute('data-sig') === sig) {
      /* 结构没变（只是某个开关被拨了）：只同步开关外观 + 分组计数 + 进度条，不重建 DOM */
      updateModuleSwitches(animateKey);
      updateGroupCounts();
      renderProgress();
      return;
    }
    keepScroll(function () {
      var fragment = document.createDocumentFragment();
      if (!state.available) {
        fragment.appendChild(emptyHint(t('switch_unavailable'), true));
      } else if (!state.tools.length) {
        fragment.appendChild(emptyHint(t('modules_empty'), false));
      } else {
        var groups = visibleGroups();
        if (!groups.length) {
          /* 搜索没命中：明确说"没找到"，而不是留一片空白 */
          fragment.appendChild(emptyHint(t('modules_no_match', { q: state.modQuery }), false));
        } else {
          for (var g = 0; g < groups.length; g += 1) {
            fragment.appendChild(buildGroup(groups[g]));
          }
        }
      }
      clearNode(list);
      list.appendChild(fragment);
      list.setAttribute('data-sig', sig);
    });
    updateModuleSwitches(animateKey);
    renderProgress();
  }

  /* 一个分组：头部（箭头 + 名字 + 已开 N/M）+ 内容 */
  function buildGroup(group) {
    var wrap = document.createElement('div');
    wrap.className = 'group' + (group.open ? ' is-open' : '');
    wrap.setAttribute('data-group', group.key);

    var head = document.createElement('button');
    head.type = 'button';
    head.className = 'group-head';
    head.setAttribute('aria-expanded', group.open ? 'true' : 'false');
    head.addEventListener('click', function () { onGroupToggle(group.key); });

    var arrow = document.createElement('span');
    arrow.className = 'group-arrow';
    arrow.innerHTML = '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" '
      + 'stroke="currentColor" stroke-width="3" stroke-linecap="round" '
      + 'stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>';

    var nameEl = document.createElement('span');
    nameEl.className = 'group-name';
    nameEl.textContent = t(group.i18n);

    var hintEl = document.createElement('span');
    hintEl.className = 'group-hint';

    head.appendChild(arrow);
    head.appendChild(nameEl);
    head.appendChild(hintEl);

    var body = document.createElement('div');
    body.className = 'group-body';
    var inner = document.createElement('div');
    inner.className = 'module-list';
    for (var i = 0; i < group.tools.length; i += 1) {
      inner.appendChild(buildModuleRow(group.tools[i], i));
    }
    body.appendChild(inner);

    wrap.appendChild(head);
    wrap.appendChild(body);
    updateGroupHead(wrap, group.tools);
    return wrap;
  }

  /* 分组头的计数：已开 N / 共 M；整组关掉时给整组一个 .is-off 便于一眼定位 */
  function updateGroupHead(wrap, tools) {
    if (!wrap) return;
    var on = 0;
    for (var i = 0; i < tools.length; i += 1) {
      if (tools[i] && tools[i].enabled !== false) on += 1;
    }
    var hint = wrap.querySelector('.group-hint');
    if (hint) hint.textContent = on + '/' + tools.length;
    wrap.classList.toggle('is-off', on === 0);
  }

  /* 只刷新每个分组的计数（不重建 DOM）：拨了某一项之后必须调一次 */
  function updateGroupCounts() {
    var wraps = document.querySelectorAll('#modules-list .group');
    for (var i = 0; i < wraps.length; i += 1) {
      var key = wraps[i].getAttribute('data-group');
      var tools = [];
      for (var j = 0; j < state.tools.length; j += 1) {
        if (groupOf(String(state.tools[j].name || '')) === key) tools.push(state.tools[j]);
      }
      updateGroupHead(wraps[i], tools);
    }
  }

  /* 总进度：已开 / 总数，同时更新顶部文字与细进度条 */
  function renderProgress() {
    var fill = $('mod-progress-fill');
    var text = $('mod-progress-text');
    var total = state.tools.length;
    var on = enabledCount();
    if (fill) fill.style.width = total ? (Math.round(on / total * 100) + '%') : '0%';
    if (text) text.textContent = total ? (on + ' / ' + total) : '';
  }

  function buildModuleRow(tool, index) {
    var name = String(tool.name || ('#' + (index + 1)));
    var on = tool.enabled !== false;
    var row = document.createElement('div');
    /* 两列布局：信息左（名字 + 参数 + 危险 + 描述）、开关右下。
       关掉的整行淡化（.is-muted）——"开着的那些"就会自己跳出来。 */
    row.className = 'module-row'
      + (tool.danger ? ' is-danger' : '')
      + (on ? '' : ' is-muted');

    var textBox = document.createElement('div');
    textBox.className = 'module-text';

    var tags = document.createElement('div');
    tags.className = 'tags';

    /* ⚠️⚠️ 标题三语（用户原话：「插件界面有些东西只有英文的没用其他2个语言的了，
       我要的是三语言而且和设置中的语言同切换」）。
       以前 nameEl 直接放 tool.name（search_resources 这种英文标识符）当**唯一标题**，
       所以切中文/繁中标题还是全英文。现在：
         · 主标题 = tool.label（后端按当前语言给的短名，如「搜索资源」/「Search」）；
         · tool.name 降级成 mono 副标签（开发者对照用，保持等宽小字）。
       ⚠️ label 缺失时（老后端）回退成 name，行为不倒退。 */
    var label = String(tool.label || '').trim();
    var nameEl = document.createElement('span');
    nameEl.className = 'module-name';
    nameEl.textContent = label || name;
    tags.appendChild(nameEl);

    /* 英文标识符：有三语标签时才额外显示（否则它就已经是标题了，别重复） */
    if (label && label !== name) {
      var keyEl = document.createElement('span');
      keyEl.className = 'tag mono is-key';
      keyEl.textContent = name;
      tags.appendChild(keyEl);
    }

    var params = String(tool.parameters || '').trim();
    if (params) {
      var paramsEl = document.createElement('span');
      paramsEl.className = 'tag mono is-param';
      paramsEl.textContent = params;
      tags.appendChild(paramsEl);
    }
    if (tool.danger) {
      var dangerEl = document.createElement('span');
      dangerEl.className = 'tag is-danger';
      dangerEl.textContent = t('module_danger');
      tags.appendChild(dangerEl);
    }

    var descEl = document.createElement('div');
    descEl.className = 'module-desc';
    descEl.textContent = pickText(tool.description);

    textBox.appendChild(tags);
    if (descEl.textContent) textBox.appendChild(descEl);

    var endBox = document.createElement('div');
    endBox.className = 'row-end';

    var sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'switch';
    sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-label', name);
    sw.setAttribute('data-tool', name);
    setSwitch(sw, on);
    sw.disabled = !!state.preview || state.busy;
    sw.addEventListener('click', function () { onModuleToggle(name); });

    endBox.appendChild(sw);
    row.appendChild(textBox);
    row.appendChild(endBox);
    row.setAttribute('data-on', on ? '1' : '0');
    return row;
  }

  /* 分组折叠：写 localStorage，再只切 class（不重建 DOM —— 重建会丢滚动位置并闪一下） */
  function onGroupToggle(key) {
    var collapsed = readCollapsed();
    /* collapsed[key] === true 表示「现在是折叠的」→ 点一下变展开（false）；
       否则（未设置或 false）→ 点一下变折叠（true）。 */
    collapsed[key] = (collapsed[key] !== true);
    writeCollapsed(collapsed);
    var wrap = document.querySelector('#modules-list .group[data-group="' + key + '"]');
    if (!wrap) return;
    var open = !collapsed[key];
    wrap.classList.toggle('is-open', open);
    var head = wrap.querySelector('.group-head');
    if (head) head.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  /* 搜索框输入：改 state.modQuery → 重算签名 → 触发列表重建（有 120ms 防抖，别每敲一键都重建） */
  var _searchTimer = 0;
  function onSearchInput(value) {
    state.modQuery = String(value || '');
    var clear = $('mod-search-clear');
    if (clear) clear.classList.toggle('show', !!state.modQuery);
    if (_searchTimer) window.clearTimeout(_searchTimer);
    _searchTimer = window.setTimeout(function () {
      _searchTimer = 0;
      renderModuleList();
    }, 120);
  }

  function renderModules(animateKey) {
    renderModulesCount();
    var panel = $('modules-panel');
    if (panel) panel.hidden = !state.modulesOpen;
    var toggle = $('modules-toggle');
    if (toggle) {
      toggle.hidden = state.modulesOpen;
      toggle.textContent = t('btn_open_modules');
      toggle.disabled = !!state.preview;
    }
    var badge = $('modules-badge');
    if (badge && state.available && state.tools.length) {
      var allOn = enabledCount() === state.tools.length;
      badge.textContent = allOn ? t('modules_badge_all_on')
                                : t('modules_badge_partial', { off: state.tools.length - enabledCount() });
      badge.className = 'badge ' + (allOn ? 'is-on' : 'is-off');
      badge.hidden = false;
    } else if (badge) {
      badge.hidden = true;
    }
    var back = $('modules-back');
    if (back) back.disabled = !!state.preview;
    var allOnBtn = $('all-on');
    if (allOnBtn) allOnBtn.disabled = !!state.preview || !state.available || state.busy;
    var allOffBtn = $('all-off');
    if (allOffBtn) allOffBtn.disabled = !!state.preview || !state.available || state.busy;
    var searchBox = $('mod-search');
    if (searchBox) searchBox.disabled = !!state.preview || !state.available;
    if (state.modulesOpen) renderModuleList(animateKey);
  }

  function setModulesOpen(open) {
    state.modulesOpen = !!open;
    renderModules();
  }

  /* =====================================================================
     渲染：最近动作
     ===================================================================== */

  function actionsSignature() {
    var parts = [state.available ? '1' : '0', state.code];
    if (!state.available) return parts.join('|');
    var rows = state.actions.slice(0, MAX_ACTIONS);
    for (var i = 0; i < rows.length; i += 1) {
      parts.push([rows[i].ts, rows[i].ok ? 1 : 0, rows[i].tool, rows[i].detail].join('~'));
    }
    return parts.join('|');
  }

  function renderActions() {
    var list = $('actions-list');
    var empty = $('actions-empty');
    if (!list) return;
    var sig = actionsSignature();
    if (list.getAttribute('data-sig') === sig) return;   // 内容没变：不重建，免得动滚动条
    keepScroll(function () {
      clearNode(list);
      if (!state.available) {
        if (empty) {
          empty.hidden = false;
          empty.textContent = t('switch_unavailable');
          empty.className = 'empty is-warn';
        }
        return;
      }
      var rows = state.actions.slice(0, MAX_ACTIONS);
      if (!rows.length) {
        if (empty) {
          empty.hidden = false;
          empty.textContent = t('actions_empty');
          empty.className = 'empty';
        }
        return;
      }
      if (empty) empty.hidden = true;
      for (var i = 0; i < rows.length; i += 1) list.appendChild(buildActionLine(rows[i]));
    });
    list.setAttribute('data-sig', sig);
  }

  /* 按 lang 的 action_line 模板拼一行：{ts}  {mark}  {tool} — {detail}
     mark 单独套一个带颜色的 span，其余按模板原样保留（换语言/换格式都不用改代码） */
  function buildActionLine(item) {
    var ok = item.ok === undefined ? true : !!item.ok;
    var values = {
      ts: String(item.ts || ''),
      mark: t(ok ? 'mark_ok' : 'mark_fail'),
      tool: String(item.tool || ''),
      detail: String(item.detail || '')
    };
    if (values.detail.length > MAX_ACTION_DETAIL) {
      values.detail = values.detail.slice(0, MAX_ACTION_DETAIL - 1) + '…';
    }
    var line = document.createElement('div');
    line.className = 'action-line' + (ok ? '' : ' is-fail');

    var template = t('action_line');
    var pattern = /\{(ts|mark|tool|detail)\}/g;
    var last = 0;
    var match = pattern.exec(template);
    if (!match) {
      /* 模板坏了（没有占位符）：退回一句最朴素的拼法，绝不显示裸 key */
      line.textContent = values.ts + '  ' + values.mark + '  ' + values.tool + ' — ' + values.detail;
      return line;
    }
    while (match) {
      if (match.index > last) line.appendChild(document.createTextNode(template.slice(last, match.index)));
      var field = match[1];
      if (field === 'mark') {
        var mark = document.createElement('span');
        mark.className = ok ? 'mark-ok' : 'mark-fail';
        mark.textContent = values.mark;
        line.appendChild(mark);
      } else {
        line.appendChild(document.createTextNode(values[field]));
      }
      last = match.index + match[0].length;
      match = pattern.exec(template);
    }
    if (last < template.length) line.appendChild(document.createTextNode(template.slice(last)));
    return line;
  }

  /* =====================================================================
     渲染：统计
     ===================================================================== */

  function formatCalls(calls) {
    if (!isObject(calls)) return '';
    var items = Object.keys(calls).map(function (name) {
      return { name: name, count: asInt(calls[name]) };
    });
    if (!items.length) return '';
    items.sort(function (a, b) {
      if (b.count !== a.count) return b.count - a.count;
      return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
    });
    var parts = [];
    for (var i = 0; i < items.length && i < MAX_CALL_ITEMS; i += 1) {
      parts.push(items[i].name + '×' + items[i].count);
    }
    var text = parts.join(', ');
    if (items.length > MAX_CALL_ITEMS) text += ' …';
    if (text.length > MAX_CALL_TEXT) text = text.slice(0, MAX_CALL_TEXT - 1) + '…';
    return text;
  }

  function renderStats() {
    var line = $('stats-line');
    var calls = $('stats-calls');
    if (!line) return;
    if (!state.available) {
      line.textContent = t('switch_unavailable');
      line.className = 'stats-line is-warn';
      if (calls) calls.textContent = '';
      return;
    }
    line.className = 'stats-line';
    var stats = isObject(state.stats) ? state.stats : {};
    line.textContent = t('stats_line', { tools: asInt(stats.tools), total: asInt(stats.total) });
    var detail = formatCalls(stats.calls);
    if (calls) calls.textContent = detail ? t('stats_calls', { calls: detail }) : '';
  }

  /* 预览模式：全部控件置灰（只读）。agent_state 失败但 api 在时不算预览，刷新按钮要留着能重试 */
  function applyPreviewDisabled() {
    if (!state.preview) return;
    var nodes = document.querySelectorAll('.switch, .btn, select');
    for (var i = 0; i < nodes.length; i += 1) nodes[i].disabled = true;
  }

  function renderAll() {
    keepScroll(function () {
      applyStaticText();
      renderMaster();
      renderModules();
      renderActions();
      renderStats();
      applyPreviewDisabled();
    });
  }

  /* =====================================================================
     数据刷新
     ===================================================================== */

  function applyPayload(payload) {
    state.available = true;
    /* 强制开启：后端回 locked=true 就锁死总开关（老后端没有这个字段 → false） */
    state.locked = !!payload.locked;
    state.enabled = !!payload.enabled || state.locked;
    state.settingOn = !!payload.setting_on;
    state.tools = Array.isArray(payload.tools) ? payload.tools.filter(isObject) : [];
    state.stats = isObject(payload.stats) ? payload.stats : {};
    state.actions = Array.isArray(payload.actions) ? payload.actions.filter(isObject) : [];
  }

  function setBusy(busy) {
    state.busy = !!busy;
    var refresh = $('actions-refresh');
    if (refresh) refresh.disabled = state.busy;
  }

  async function refreshAll(options) {
    var silent = !!(options && options.silent);
    var top = scrollTopOf();              // 读数据期间内容可能先变矮，先把滚动位置记下来
    try {
      if (state.preview || !state.api) {
        renderAll();
        return;
      }
      setBusy(true);
      var result = await callAi('agent_state');
      setBusy(false);

      if (!result || result.ok !== true) {
        state.available = false;
        state.tools = [];
        state.stats = {};
        state.actions = [];
        renderAll();
        if (!silent) {
          var error = result && result.error ? String(result.error) : '';
          toast(error ? t('refresh_failed', { error: error }) : t('switch_unavailable'), 'warn');
        }
        return;
      }
      applyPayload(result);
      /* agent_state 顺手回了 host 语言：和当前不一致就重新加载文案 */
      if (result.language) {
        var code = resolveCode(result.language);
        if (code !== state.code) {
          state.code = code;
          await loadLang(state.code);
        }
      }
      renderAll();
    } finally {
      restoreScrollTop(top);
    }
  }

  /* =====================================================================
     交互
     ===================================================================== */

  async function onMasterToggle() {
    if (state.preview || !state.api || !state.available || state.busy) return;
    /* 强制开启的插件：后端也会拒绝关闭，这里先拦一道，免得拨了又回弹 */
    if (state.locked) {
      toast(t('switch_locked'), 'warn');
      return;
    }
    var next = !state.enabled;
    state.enabled = next;
    renderMaster(true);          // 用户真的点击 → 保留滑动动效
    var result = await callAi('set_agent_enabled', next);
    if (!result || result.ok !== true) {
      toast(t('switch_toggle_failed', { error: errText(result) }), 'warn');
      await refreshAll({ silent: true });
      return;
    }
    state.enabled = !!result.enabled;
    renderMaster();
    /* 改配置不再弹已保存；只有失败才提示 */
    await refreshAll({ silent: true });
  }

  async function onModuleToggle(name) {
    if (state.preview || !state.api || !state.available || state.busy) return;
    var item = null;
    for (var i = 0; i < state.tools.length; i += 1) {
      if (String(state.tools[i].name || '') === name) { item = state.tools[i]; break; }
    }
    if (!item) return;
    var wanted = item.enabled === false;   // 现在关着 → 打开
    item.enabled = wanted;                 // 先乐观地画出来（只动这一个开关，不重建列表）
    updateModuleSwitches(name);            // 用户点击的这一项带动效，其余静默同步
    renderModulesCount();
    var result = await callAi('set_agent_tool', name, wanted);
    if (!result || result.ok !== true) {
      item.enabled = !wanted;
      updateModuleSwitches(name);        // 回滚也是这一项：带动效
      renderModulesCount();
      toast(t('module_toggle_failed', { error: errText(result) }), 'warn');
      return;
    }
    if (Array.isArray(result.tools)) {
      state.tools = result.tools.filter(isObject);
    }
    renderModules();                      // 结构没变 → 只同步开关与计数
  }

  async function setAllTools(on) {
    if (state.preview || !state.api || !state.available) return;
    var result = await callAi('set_all_agent_tools', on);
    if (!result || result.ok !== true) {
      toast(t('module_toggle_failed', { error: errText(result) }), 'warn');
      return;
    }
    if (Array.isArray(result.tools)) {
      state.tools = result.tools.filter(isObject);
    }
    renderModules(ANIMATE_ALL);           // 用户点了全部开/关 → 每项都带动效
    toast(t(on ? 'modules_all_on' : 'modules_all_off'), 'ok');
  }

  async function onClearActions() {
    if (state.preview || !state.api || !state.available) return;
    var result = await callAi('clear_agent_actions');
    if (!result || result.ok !== true) {
      toast(t('actions_clear_failed', { error: errText(result) }), 'warn');
      return;
    }
    state.actions = Array.isArray(result.actions) ? result.actions.filter(isObject) : [];
    renderActions();
    toast(t('actions_cleared'), 'ok');
    /* 清空动作时注册表的计数器也归零，顺手把统计刷新一遍 */
    await refreshAll({ silent: true });
  }

  /* =====================================================================
     预览模式（没有 host 接口）
     ===================================================================== */

  function enterPreview() {
    state.preview = true;
    state.available = false;
    state.enabled = false;
    state.tools = [];
    state.stats = {};
    state.actions = [];
    state.dict = {};
    for (var key in FALLBACK_ZH) { if (Object.prototype.hasOwnProperty.call(FALLBACK_ZH, key)) state.dict[key] = FALLBACK_ZH[key]; }
    applyAppearance('', DEFAULT_FX);   // 没有 host 时按系统深浅 + 云母材质画
    var banner = $('banner');
    if (banner) banner.hidden = false;
    var text = $('banner-text');
    if (text) text.textContent = t('preview');
    renderAll();
  }

  /* =====================================================================
     启动
     ===================================================================== */

  function bindEvents() {
    var master = $('master');
    if (master) master.addEventListener('click', onMasterToggle);

    var toggle = $('modules-toggle');
    if (toggle) toggle.addEventListener('click', function () { setModulesOpen(true); });
    var back = $('modules-back');
    if (back) back.addEventListener('click', function () { setModulesOpen(false); });

    /* 搜索框：输入即过滤（120ms 防抖），清空按钮一键复位。
       ⚠️ 用 input 事件而不是 keyup：中文输入法组合期间 keyup 不准，
          input 在组合确认后才发一次，不会把拼音当成搜索词。 */
    var searchBox = $('mod-search');
    if (searchBox) {
      try {
        var saved = window.localStorage.getItem(SEARCH_KEY) || '';
        if (saved) { searchBox.value = saved; state.modQuery = saved; }
      } catch (e) { /* 无 localStorage */ }
      searchBox.addEventListener('input', function () {
        var text = String(searchBox.value || '');
        try { window.localStorage.setItem(SEARCH_KEY, text); } catch (e) { /* 忽略 */ }
        onSearchInput(text);
      });
      searchBox.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && searchBox.value) {
          /* 有内容时 Esc 只清空搜索框，**不**冒泡去关整个配置页 */
          event.stopPropagation();
          searchBox.value = '';
          onSearchInput('');
        }
      });
    }
    var searchClear = $('mod-search-clear');
    if (searchClear) searchClear.addEventListener('click', function () {
      var box = $('mod-search');
      if (box) { box.value = ''; box.focus(); }
      try { window.localStorage.removeItem(SEARCH_KEY); } catch (e) { /* 忽略 */ }
      onSearchInput('');
    });
    var allOn = $('all-on');
    if (allOn) allOn.addEventListener('click', function () { setAllTools(true); });
    var allOff = $('all-off');
    if (allOff) allOff.addEventListener('click', function () { setAllTools(false); });

    var refresh = $('actions-refresh');
    if (refresh) refresh.addEventListener('click', function () { refreshAll(); });
    var clear = $('actions-clear');
    if (clear) clear.addEventListener('click', onClearActions);
  }

  async function boot() {
    /* 0) 首帧护栏：<html class="no-anim"> 写在 HTML 里（脚本执行前就在），
       兜住所有 transition/animation；下面每步 renderAll 的首次状态填充都是瞬间切换。
       首帧画完后跨两帧摘掉（用户可见的第一帧绝不带动效；两帧确保样式在下一帧才生效）。 */
    function releaseNoAnim() {
      var root = document.documentElement;
      if (root.getAttribute('class') === 'no-anim') root.removeAttribute('class');
      else root.classList.remove('no-anim');
    }
    /* 兜底：boot 链路任何一步抛异常也不能让护栏永久挂着（那会冻结所有动效） */
    window.setTimeout(releaseNoAnim, 2000);
    /* 0.5) 恢复上次的模块搜索词（在首帧渲染之前设好，否则会先闪一版全量列表） */
    try { state.modQuery = window.localStorage.getItem(SEARCH_KEY) || ''; } catch (e) { /* 无 localStorage */ }

    /* 1) 先用内置中文把界面填起来（lang 文件读不到也不会白屏） */
    state.dict = {};
    for (var key in FALLBACK_ZH) { if (Object.prototype.hasOwnProperty.call(FALLBACK_ZH, key)) state.dict[key] = FALLBACK_ZH[key]; }
    bindEvents();
    renderAll();
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(releaseNoAnim);
    });

    /* 2) 等 host 接口（iframe 里可能在父窗口上） */
    var api = await waitForApi(2500);
    if (!api) {
      enterPreview();
      return;
    }
    state.api = api;

    /* 2.5) 提示条方位：读一次宿主设置（读不到就保持底部居中的兜底位置）。
       ⚠️ 放在读语言/主题之前：它只影响后面 toast 的落点，越早越不会出现
          "第一条提示按老位置闪一下"的观感问题。 */
    var toastPos = await getSetting('toast_position');
    if (toastPos && toastPos.ok) applyToastPosition(toastPos.value);

    /* 3) 语言 / 主题（先落主题材质，再去等 lang 文件，免得先闪一下云母） */
    var prefs = await readHostPrefs();
    state.code = resolveCode(prefs.language);
    state.lastTheme = prefs.theme;
    applyAppearance(prefs.theme, prefs.theme_effect);
    await loadLang(state.code);
    renderAll();

    /* 4) 读 Agent 状态 */
    await refreshAll({ silent: true });

    /* 4.5) 接住宿主的主题同步消息（语言要重新读 lang 再重画；
       主题/效果/强调色在消息监听里已经直接落到 <html>，这里只同步内部 state） */
    window.__TGC_ON_HOST__ = function (data) {
      if (!data) return;
      if (data.theme === 'dark' || data.theme === 'light') {
        state.lastTheme = data.theme === 'dark' ? '深色主题' : '浅色主题';
      }
      if (data.fx) applyFx(data.fx);
      if (data.language) {
        var code = resolveCode(data.language);
        if (code !== state.code) {
          state.code = code;
          loadLang(code).then(function () { renderAll(); }).catch(function () { /* 语言切失败不影响主题 */ });
        }
      }
    };

    /* 5) 跟随 host 的实时设置（主题 / 语言） */
    hookHostEvents();
  }

  function start() {
    boot().catch(function (error) {
      try {
        if (!state.preview) enterPreview();
        toast(String(error && error.message ? error.message : error), 'warn');
      } catch (e) { /* 什么都做不了 */ }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
<script>
  /* ===================== Escape → 返回插件列表 =====================
     插件界面中的配置页面 esc 也是返回上级菜单。
     配置页是 iframe（/res/plugins/<id>/config.html），按 Esc 时先在本框架捕获，
     再 postMessage 给宿主（app.js 的 toolsgcp-close-plugin 监听）→ 关闭 pluginPage 回到插件列表。
     ⚠️ 只在**本框架内**拦：输入框里按 Esc 时也让步（保持"取消输入"的原生行为更稳妥），
        但 SEL 下拉在 config.html 里是自绘的，所以只在 input/textarea/contenteditable 上让步。 */
  (function () {
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape' && event.key !== 'Esc' && event.keyCode !== 27) return;
      var el = event.target;
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
      try { window.parent.postMessage({ type: 'toolsgcp-close-plugin', id: location.pathname }, '*'); }
      catch (e) { /* 顶层直接打开：忽略 */ }
    }, true);
  })();
</script>
</body>
</html>
