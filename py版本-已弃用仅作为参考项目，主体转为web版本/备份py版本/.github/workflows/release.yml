name: Build & Release

# 打一个 v* 的标签就会自动：检查代码 → 打包成 exe → 附到 Release 上
#   git tag v1.1.4 && git push origin v1.1.4
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 代码自检（语法 + 关键模块导入）
        run: |
          python -m compileall -q ".ToolsGCP/modules" ToolsGCP.pyw
          python -c "import json,glob; [json.load(open(f,encoding='utf-8')) for f in glob.glob('.ToolsGCP/**/*.json', recursive=True)]; print('JSON OK')"

      - name: 打包为单文件 exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name ToolsGCP `
            --add-data ".ToolsGCP;.ToolsGCP" `
            --hidden-import PyQt5.sip `
            ToolsGCP.pyw

      # 独立的资源制作器 exe 已经并进主程序的「提交软件」界面，仓库里不再有这个入口
      # 文件。这里保留成条件步骤：哪天要重新单独发一个，把 .pyw 放回来就会继续打包。
      - name: 打包资源制作器（ToolsGCP-ResourceMaker.pyw 存在时才打）
        if: hashFiles('ToolsGCP-ResourceMaker.pyw') != ''
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name ToolsGCP-ResourceMaker `
            --add-data ".ToolsGCP;.ToolsGCP" `
            --hidden-import PyQt5.sip `
            ToolsGCP-ResourceMaker.pyw

      - name: 生成校验值
        shell: pwsh
        run: |
          Get-FileHash dist/ToolsGCP.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  ToolsGCP.exe" } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          if (Test-Path dist/ToolsGCP-ResourceMaker.exe) {
            Get-FileHash dist/ToolsGCP-ResourceMaker.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  ToolsGCP-ResourceMaker.exe" } | Out-File -Encoding ascii -Append dist/SHA256SUMS.txt
          }
          Get-Content dist/SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ToolsGCP-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ToolsGCP.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
